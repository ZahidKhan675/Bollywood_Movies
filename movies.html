<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Posters</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }
    h2 {
      text-align: center;
      margin-top: 20px;
    }
    .poster-gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px;
    }
    .movie {
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      width: 200px;
      cursor: pointer;
      transition: 0.3s;
    }
    .movie:hover {
      transform: scale(1.05);
    }
    .movie img {
      width: 100%;
      border-radius: 8px;
    }
    #videoPlayer {
      display: none;
      text-align: center;
    }
    video {
      width: 70%;
      max-width: 720px;
      border-radius: 10px;
      margin-top: 20px;
    }
    footer {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
  <script>
    function playTrailer(videoFile) {
      const videoPlayer = document.getElementById("videoPlayer");
      const trailer = document.getElementById("trailer");

      trailer.src = videoFile;
      videoPlayer.style.display = "block";
      trailer.play();
    }
  </script>
</head>
<body>
  <header>
    <h1>🎬 Latest Movie Trailers</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="about.html">About</a> |
      <a href="contact.html">Contact</a> |
      <a href="movies.html">Movies</a>
    </nav>
  </header>

  <main>
    <h2>Featured Posters</h2>
    <div class="poster-gallery">
      <!-- Poster 1 -->
      <div class="movie" onclick="playTrailer('855389-hd_1920_1080_25fps.mp4')">
        <img src="poster1.jpg" alt="Movie Poster 1">
        <p>Demo Movie 1</p>
      </div>

      <!-- Poster 2 -->
      <div class="movie" onclick="playTrailer('trailer2.mp4')">
        <img src="poster2.jpg" alt="Movie Poster 2">
        <p>Demo Movie 2</p>
      </div>
    </div>

    <!-- Video Player -->
    <div id="videoPlayer">
      <h3>Now Playing</h3>
      <video id="trailer" controls>
        <source src="" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </main>

  <footer>
    <p>© 2025 My Website</p>
  </footer>
</body>
</html>
